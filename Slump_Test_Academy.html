<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أكاديمية اختبار الهبوط — ASTM C143/C143M-26a</title>
<style>

.tg{background:var(--am);color:#fff;padding:1px 8px;border-radius:3px;font-size:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.g2{grid-template-columns:1fr}}

<header><h1>أكاديمية اختبار الهبوط — ASTM C143/C143M – 26a <small style="font-weight:400;font-size:13px;opacity:.85">| تصميم: أحمد شاكر</small></h1><div id="h"></div><button onclick="if(confirm('مسح التقدم والبدء من جديد؟')){localStorage.removeItem('sta');S=null;hud();start()}">إعادة من البداية</button></header><div id="pb"><div id="pr"></div></div><nav id="nv"></nav><main id="m"></main><div id="pa"></div>
<script>
const $=s=>document.querySelector(s),M=$('#m'),R=a=>a[Math.random()*a.length|0],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let S;try{S=JSON.parse(localStorage.getItem('sta'))}catch(e){}
const sv=()=>{try{localStorage.setItem('sta',JSON.stringify(S))}catch(e){}};
const ST=['المهمة','المعدات','فحص القالب','التنفيذ','أنواع الهبوط','القياس','التقرير','المشرف','الامتحان'];
let ac;function snd(f,d=.12){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>snd(660),bad=()=>snd(170,.3);
function hud(){$('#h').textContent=S?`${S.name} | ${{t:'تدريب',p:'تطبيق',c:'تحدٍّ'}[S.mode]} | المستوى ${(1+S.xp/100)|0} | الخبرة ${S.xp} | الأخطاء ${S.err}`:'';$('#pr').style.width=S?(S.st/ST.length*100)+'%':'0';$('#nv').innerHTML=S?ST.map((n,i)=>`<button class="${i==S.st?'on':''}" ${i>S.mx?'disabled':''} onclick="go(${i})">${n}</button>`).join(''):''}
const FN=[s0,s1,s2,s3,s4,s5,s6,s7,s8];
function go(i){S.st=i;S.mx=Math.max(S.mx,i);sv();hud();FN[i]()}
const nxt=()=>go(S.st+1);
function start(){M.innerHTML=`<div class=card><h2>مختبر الخرسانة: أنت الفني</h2><p><b>تصميم اللعبة: أحمد شاكر</b></p><p>تتعلم اختبار الهبوط بالتنفيذ العملي وفق النسخة المرفقة <b>ASTM C143/C143M – 26a</b>. يُوسَم كل بند بمصدره: <span class=tg>ASTM</span> متطلب المواصفة، <span class=tg>مشروع</span> متطلب خاص بالمشروع، <span class=tg>ممارسة</span> توضيح مختبري. التدريب: تلميحات وتصحيح فوري. التطبيق: بلا تلميحات. التحدي: دون مساعدة وتظهر الأخطاء في النهاية.</p><label>اسم الفني<input id=nm value="${S?S.name:''}"></label><div><button class=pri onclick="beg('t')">وضع التدريب</button><button onclick="beg('p')">وضع التطبيق</button><button onclick="beg('c')">وضع التحدي</button></div>${S?`<button class=pri onclick="go(S.st)">استكمال من «${ST[S.st]}»</button>`:''}</div>`}
function beg(m){const n=$('#nm').value.trim();if(!n){alert('اكتب اسمك أولاً');return}S={name:n,mode:m,st:0,mx:0,xp:0,err:0,task:{no:'S-'+(100+Math.random()*900|0),pour:'P-'+(1+Math.random()*40|0),raw:R([83,92,107,113,98,122])}};go(0)}
let FL=[],MS=[];
function quiz(L,done,i=0,r=0){if(i>=L.length){done(r);return}
const [qq,oo,a,w,tp,c,h,s]=L[i],o=sh(oo.map((x,k)=>[x,k]));let f=0;
M.innerHTML=`<div class=card><small>سؤال ${i+1}/${L.length} <span class=tg>${s||'ASTM'}</span></small><h3>${qq}</h3><div>${o.map((x,j)=>`<button class=op data-j=${j}>${x[0]}</button>`).join('')}</div><div id=f>${S.mode=='t'&&h?`<p class=hint>تلميح: ${h}</p>`:''}</div></div>`;
const all=()=>M.querySelectorAll('.op');
all().forEach(b=>b.onclick=()=>{const k=o[b.dataset.j][1],nx=`<button class=pri id=nx>التالي</button>`,bn=()=>{$('#nx').onclick=()=>quiz(L,done,i+1,r)};
if(k==a){good();b.classList.add('ok');if(!f){r++;S.xp+=S.mode=='t'?6:10}all().forEach(x=>x.disabled=1);$('#f').innerHTML=`<div class="fb g"><b>✓ صحيح.</b> ${w}</div>${nx}`;hud();sv();bn()}
else{bad();if(!f){f=1;S.err++;MS.push(tp);if(c)FL.push(tp)}b.classList.add('no');b.disabled=1;hud();
if(S.mode=='t')$('#f').innerHTML=`<div class="fb b"><b>✗ ليست الإجابة.</b> ${w}<br>جرّب إجابة أخرى.</div>`;
else{all().forEach(x=>{x.disabled=1;if(o[x.dataset.j][1]==a)x.classList.add('ok')});$('#f').innerHTML=`<div class="fb b"><b>✗ الإجابة الصحيحة بالأخضر.</b> ${w}</div>${nx}`;bn()}}})}
// ---- بنوك الأسئلة: [سؤال، خيارات، رقم الصحيح، تفسير، موضوع، حرج، تلميح، مصدر]
const B0=[['ما الذي يقيسه اختبار الهبوط؟',['قوام الخرسانة الطازجة وقابليتها للتشغيل','مقاومة الضغط مباشرة','نسبة الهواء المحبوس','محتوى الأسمنت'],0,'الهبوط يراقب قوام الخرسانة غير المتصلدة (البند 4.1، ملاحظة 2). ارتباطه العكسي بالمقاومة يظهر مختبرياً بضبط صارم للمواد ولا يتضح دائماً في الموقع، فلا تُستنتج منه المقاومة مباشرة.','مفاهيم',0,'الخرسانة هنا ما زالت طازجة.'],
['طلب المشروع هبوطاً 100 ± 25 مم. من يضع حدود القبول هذه؟',['مواصفات المشروع/المهندس','ASTM C143 نفسها','الفني وقت الاختبار','مورّد القالب'],0,'C143 تحدد الإجراء وطريقة الإبلاغ فقط ولا تضع حدود قبول؛ الحدود متطلب مشروع.','مفاهيم',0,'',  'مشروع'],
['الحجم الاسمي الأكبر للركام 50 مم. ما الإجراء؟',['تنخيل رطب لجزء كافٍ من العينة على منخل 37.5 مم وفق C172 ثم الاختبار','الاختبار على الخرسانة كما هي','إضافة ماء لتسهيل الملء','استخدام قالب أكبر'],0,'الطريقة تنطبق على ركام حتى 37.5 مم؛ فوق ذلك يُختبر الجزء المار من منخل 37.5 مم (البنود 4.2 و6.1).','العينة',0,'']];
const B2=[['أي مجموعة أبعاد تطابق قالب الهبوط (البند 5.1)؟',['قاعدة 200 مم، قمة 100 مم، ارتفاع 300 مم','قاعدة 150، قمة 100، ارتفاع 300','قاعدة 200، قمة 100، ارتفاع 200','قاعدة 300، قمة 150، ارتفاع 200'],0,'القالب مخروط ناقص: القاعدة 8 in [200 مم]، القمة 4 in [100 مم]، الارتفاع 12 in [300 مم].','القالب',0,'القاعدة ضعف القمة.'],
['ما التفاوت المسموح لكل قطر وارتفاع؟',['±3 مم (⅛ in)','±10 مم','±1 مم','لا تفاوت'],0,'البند 5.1: كل قطر وارتفاع ضمن ±⅛ in [3 مم] من المقرر.','القالب',0],
['قطر القمة المقاس لقالبك 105 مم. القرار؟',['القالب غير مطابق (خارج 97–103 مم) ولا يُستخدم','مقبول لأن الفرق صغير','مقبول إن كانت القاعدة صحيحة','يُقبل إن رُطّب'],0,'التفاوت ±3 مم يعني القمة بين 97 و103 مم؛ 105 خارج الحد فتتأثر النتائج.','القالب',0],
['وجدت ملاطاً متصلباً داخل القالب وانبعاجاً في جداره. ماذا تفعل؟',['لا تستخدمه إلى أن يُنظَّف/يُستبدل لأنه يجب أن يخلو من الملاط والتشوه','تستخدمه إن كان الانبعاج صغيراً','تدق عليه لإزالة الانبعاج أثناء الاختبار','تغطيه بالماء'],0,'البند 5.1: داخل القالب أملس خالٍ من النتوءات، وخالٍ من التبعّجات والتشوه والملاط الملتصق.','القالب',0],
['متى يُتحقق من مطابقة أبعاد القالب؟',['عند الشراء أو أول استخدام ثم سنوياً على الأقل','كل اختبار','مرة واحدة فقط','عند الشك فقط'],0,'البند 5.1.1: التحقق والتسجيل عند الشراء/أول خدمة وسنوياً على الأقل.','القالب',0],
['أي قضيب دمك يطابق البند 5.2؟',['أملس مستدير قطره 16 ± 2 مم وطرفه نصف كروي','مضلّع قطره 12 مم','أملس قطره 25 مم بطرف مسطح','مربع المقطع'],0,'القضيب دائري أملس مستقيم بقطر ⅝ in [16 مم] ± 1/16 in [2 مم] وطرف نصف كروي بالقطر نفسه، وطوله 400–600 مم لقالب الهبوط.','الأدوات',0]];
const B7=[['فنّي دمك كل طبقة 15 ضربة. ما موقفك؟',['الاختبار غير مطابق؛ تُهمل النتيجة ويُعاد بالإجراء الصحيح','تقبل النتيجة إن بدت منطقية','تضيف 10 ضربات للطبقة العليا فقط','تعدّلها إلى الأعلى 5 مم'],0,'البند 7.2 يلزم 25 ضربة لكل طبقة. تغيير الدمك يغيّر الحالة التي يُقاس عليها القوام فلا تُعد النتيجة ممثلة.','الدمك',1],
['لم يُثبَّت القالب أثناء التعبئة (لا وقوف على القدمين ولا مشبك). النتيجة؟',['غير صالحة: يجب إمساكه بإحكام أثناء الملء وتنظيف المحيط','صالحة إن لم يتحرك كثيراً','صالحة إذا كان القالب ثقيلاً','تُصحَّح بإضافة 5 مم'],0,'البند 7.1: يُثبّت القالب بإحكام بالقدمين أو بمشبك إلى لوحة قاعدة، فحركته تُخلّ بشكل العينة.','التثبيت',1],
['بعد رفع القالب سقط جانب واحد من الكتلة (قص). القرار؟',['تهمل الاختبار وتعيده على جزء آخر من العينة','تسجّل الهبوط من الجانب الأعلى','تأخذ متوسط الجانبين','تقبله وتسجل ملاحظة'],0,'البند 7.4: عند سقوط/قص واضح لجانب من الكتلة يُهمل الاختبار ويُجرى آخر على جزء آخر من العينة. فإن تكرر في اختبارين متتاليين فالخرسانة غالباً تفتقر للّدونة والتماسك (ملاحظة 8).','أنواع الهبوط',1],
['النتيجة 150 مم والمطلوب 100 ± 25 مم (متطلب مشروع). ما الصحيح؟',['تُسجَّل كما قيست وتُبلَّغ للمهندس وفق إجراءات المشروع؛ الحكم للمواصفة الخاصة','تعدّل القياس ليطابق','تضيف أسمنتاً للعينة وتعيد','تُهمَل لأنها مرتفعة'],0,'C143 تقيس وتُبلّغ ولا تقرر القبول. إخفاء النتيجة أو التلاعب بالعينة مخالفة مهنية.','التفسير',0,'','مشروع'],
['رُفع القالب مائلاً مع التواء. ما أثره؟',['مخالف للبند 7.3 (رفع رأسي بلا حركة جانبية/التوائية) وقد يسبب قصاً فيُهمل الاختبار','لا أثر','يرفع الهبوط 5 مم','مقبول إن كان سريعاً'],0,'يجب رفع القالب رأسياً بحركة ثابتة؛ الميل يشوّه الانهيار.','الرفع',1],
['استغرق الاختبار 4 دقائق من بدء الملء حتى رفع القالب. القرار؟',['غير مطابق: الحد 2½ دقيقة دون انقطاع، فيُعاد','مطابق','مطابق إن كانت الخرسانة بطيئة التماسك','يُضاف 30 ث لكل طبقة'],0,'البند 7.3: يُنجز الاختبار كله من بدء الملء حتى رفع القالب دون انقطاع خلال 2½ دقيقة.','الزمن',1]];
const BX=[['عدد طبقات الملء وضربات الدمك لكل طبقة؟',['3 طبقات، 25 ضربة لكل طبقة','2 طبقتان، 25 ضربة','3 طبقات، 10 ضربات','4 طبقات، 25 ضربة'],0,'البندان 7.1 و7.2: ثلاث طبقات بحجم ≈ثلث القالب لكل منها و25 ضربة بالقضيب.','الدمك',1],
['زمن رفع القالب مسافة 300 مم؟',['5 ± 2 ثانية','أقل من ثانية','10–15 ثانية','30 ثانية'],0,'البند 7.3: رفع 12 in [300 مم] خلال 5 ± 2 ث بحركة ثابتة.','الرفع',1]];
const B4C=[['ظهر قص جانبي في اختبارين متتاليين لعينة واحدة. ماذا يعني؟',['الخرسانة غالباً تفتقر للّدونة والتماسك فلا ينطبق الاختبار عليها','القالب جديد','الخرسانة ممتازة','يجب الاستمرار حتى يظهر هبوط حقيقي'],0,'الملاحظة 8 للبند 7.4.','أنواع الهبوط',0],
['هبوط مقيس 10 مم. كيف تُفسَّر النتيجة؟',['بحذر: أقل من 15 مم قد لا تكون الخرسانة لدنة بما يكفي (ملاحظة 3)','ممتازة دائماً','غير ممكنة','تعدّل لـ15'],0,'ملاحظة 3 توضيحية وليست متطلباً: دون 15 مم أو فوق نحو 230 مم يلزم الحذر في التفسير.','التفسير',0]];
// ---- رسومات
const cone='117,30 183,30 217,230 83,230';
function sl(t,mm){const y=30+mm*.667,P={true:`M70,230 C85,200 100,${y+15} 125,${y} L175,${y} C200,${y+15} 215,200 230,230Z`,shear:`M60,230 L85,150 L120,${y+30} L205,${y+55} L250,230Z M215,230 L275,230 L240,205Z`,collapse:`M20,230 Q30,185 150,180 Q270,185 280,230Z`};
return `<svg viewBox="0 0 300 250" class="sv sl"><line x1=40 x2=260 y1=30 y2=30 stroke="#667" stroke-dasharray="5"/><text x=45 y=24 font-size=11 fill="#334">قمة القالب الأصلية</text><rect x=20 y=230 width=260 height=8 fill="#555"/><path d="${P[t]}" fill="#7f868b" stroke="#333" stroke-width="2"/></svg>`}
function cs(d){const y=v=>230-v*.667,L=[[0,70,'#7c8286'],[70,160,'#92918c'],[160,300,'#6f767b']];
return `<svg viewBox="0 0 300 260" class=sv><defs><clipPath id=cp><polygon points="${cone}"/></clipPath></defs><rect x=30 y=230 width=240 height=8 fill="#555"/><polygon points="${cone}" fill="#eef1f3" stroke="#33414d" stroke-width="2"/><rect x=70 y=224 width=14 height=6 fill="#33414d"/><rect x=216 y=224 width=14 height=6 fill="#33414d"/><g clip-path="url(#cp)">${L.map(l=>d>l[0]?`<rect x=60 y=${y(Math.min(d,l[1]))} width=180 height=${(Math.min(d,l[1])-l[0])*.667} fill="${l[2]}"/>`:'').join('')}</g>${d>300?'<ellipse cx=150 cy=28 rx=40 ry=10 fill="#6f767b"/>':''}</svg>`}
const fr=mm=>{const f=Math.round(mm/25.4*4);return (f>>2)+['',' ¼',' ½',' ¾'][f&3]};
// ---- 0 المهمة

function s7(){M.innerHTML=`<div class=card><h2>اختبار المهندس المشرف</h2><p>سيناريوهات من المختبر والموقع: اكتشف الخطأ واتخذ القرار.</p><button class=pri id=b>ابدأ</button></div>`;$('#b').onclick=()=>quiz(B7,()=>{S.xp+=30;nxt()})}
// ---- 8 الامتحان
const ORD=['ترطيب القالب ووضعه على قاعدة صلبة مستوية رطبة غير ماصة','تثبيت القالب بالقدمين','ملء الطبقة الأولى (≈70 مم) ودمكها 25 ضربة','ملء الثانية (≈160 مم) ودمكها 25 ضربة مع اختراق ≈25 مم','تكويم الطبقة العليا ودمكها 25 ضربة','تسوية السطح بالقضيب','إزالة الخرسانة حول القاعدة','رفع القالب 300 مم رأسياً خلال 5±2 ث','قياس الفرق الرأسي إلى مركز السطح المزاح','تسجيل الهبوط لأقرب 5 مم'];
function s8(){M.innerHTML=`<div class=card><h2>الامتحان الشامل</h2><p>14 سؤالاً ثم ترتيب الخطوات، بلا تلميحات. الشهادة تشترط ≥80% وعدم الإخفاق في أي بند جوهري وإنجاز التنفيذ العملي دون أخطاء مؤثرة في وضع التطبيق أو التحدي.</p><button class=pri id=b>ابدأ الامتحان</button></div>`;
$('#b').onclick=()=>{FL=[];MS=[];const m=S.mode;S.mode='p';const Q=sh(B0.concat(B2,B7,B4C,BX)).slice(0,14);quiz(Q,r=>{S.mode=m;order(r,Q)})}}
function order(r,Q){let ch=[];const E=sh(ORD.map((x,i)=>i));function dr(){M.innerHTML=`<div class=card><h3>رتّب خطوات الاختبار</h3><ol>${ch.map(i=>`<li>${ORD[i]}</li>`).join('')}</ol>${E.filter(i=>!ch.includes(i)).map(i=>`<button class=op data-i=${i}>${ORD[i]}</button>`).join('')}<button id=u>تراجع</button><button class=pri id=k ${ch.length<10?'disabled':''}>تحقق</button></div>`;
M.querySelectorAll('.op').forEach(b=>b.onclick=()=>{ch.push(+b.dataset.i);dr()});$('#u').onclick=()=>{ch.pop();dr()};$('#k').onclick=()=>{const c=ch.filter((x,i)=>x==i).length;if(c<8){FL.push('ترتيب الخطوات');MS.push('ترتيب الخطوات')}res(r+Math.round(c/10*3),Q.length+3)}}dr()}
function res(p,tot){const pc=Math.round(p/tot*100),cr=[...new Set(FL)],ms=[...new Set(MS)],pass=pc>=80&&!cr.length&&S.ok2&&S.err<9999;
const why=[];if(pc<80)why.push('الدرجة دون 80%');if(cr.length)why.push('إخفاق في بنود جوهرية: '+cr.join('، '));if(!S.ok2)why.push('لم تُنجز التنفيذ العملي في وضع التطبيق أو التحدي بنجاح');
if(pass){S.cert=1;S.xp+=100;sv();hud()}
M.innerHTML=`<div class=card><h2>${pass?'اجتزت الامتحان':'لم تتحقق شروط الإتقان'}</h2><p>الدرجة ${p}/${tot} — نسبة الإتقان ${pc}%</p>${why.length?`<div class="fb b">${why.join('<br>')}</div>`:''}<p><b>نقاط القوة:</b> ${['المفاهيم','القالب','الأدوات','الدمك','الرفع','الزمن','التثبيت','أنواع الهبوط','التفسير','العينة'].filter(x=>!ms.includes(x)).join('، ')||'—'}</p><p><b>تحتاج تدريباً في:</b> ${ms.join('، ')||'لا شيء'}</p><p><b>توصية:</b> ${ms.length?'أعد مرحلة التنفيذ والمشرف في وضع التدريب ثم أعد الامتحان.':'أحسنت.'}</p>${pass?`<button class=pri id=ce>عرض الشهادة</button>`:''}<button onclick=go(3)>إعادة التنفيذ</button><button onclick=s8()>إعادة الامتحان</button></div>`;
if(pass)$('#ce').onclick=()=>{pr(`<div class=rep style="text-align:center"><h1>شهادة إتقان اختبار الهبوط</h1><p>تشهد أكاديمية اختبار الهبوط بأن</p><h2>${S.name}</h2><p>أتقن إجراء اختبار هبوط الخرسانة وفق ASTM C143/C143M – 26a بنسبة ${pc}% (تدريب تعليمي، وليست شهادة اعتماد رسمية)</p><p>${new Date().toLocaleDateString('ar')} — الخبرة ${S.xp}</p><p>تصميم اللعبة: أحمد شاكر</p></div>`);document.body.classList.add('pp');print();document.body.classList.remove('pp')}}
hud();start();
